<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>League Standings — Fantasy Football</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header>
  <h1>League Standings</h1>
  <p class="sub" id="subtitle">Cumulative ranking points, normalized so the playoff cutoff = 0.</p>
</header>

<main>
  <section id="empty-state" class="hidden">
    <div class="empty-card">
      <h2>The season hasn't started yet 🏈</h2>
      <p>Standings will populate automatically once Week&nbsp;1 games are final.</p>
    </div>
  </section>

  <section id="chart-section" class="hidden">
    <h2>Playoff Position by Week</h2>
    <div class="chart-wrap"><canvas id="positionChart"></canvas></div>
  </section>

  <section id="table-section" class="hidden">
    <h2>Standings</h2>
    <div class="table-wrap">
      <table id="standings-table">
        <thead>
          <tr><th>#</th><th class="left">Team</th><th class="left">Manager</th>
              <th>Points</th><th>Norm</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<footer>
  <span id="updated"></span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="js/charts.js"></script>
</body>
</html>
