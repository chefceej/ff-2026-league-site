name: Update League Data

on:
  schedule:
    # Game-day refreshes come from cron-job.org (every 10 min, America/Chicago:
    # Sun 12-11:50 PM, Mon/Thu 7-11:50 PM), which POSTs a workflow_dispatch
    # using a fine-grained PAT (Actions: read/write on this repo only). GitHub's
    # own scheduler dropped or delayed most game-window crons, so it now only
    # runs a nightly backstop to pick up late stat corrections.
    - cron: '10 6 * * *'         # nightly backup, ~1 AM CT (single one-shot fetch)
  workflow_dispatch:          # cron-job.org game-day pings + manual runs

permissions:
  contents: write

# Don't let a neighbouring run race on git push; queue instead of overlapping.
concurrency:
  group: update-league-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install espn_api

      - name: Fetch + commit league data
        env:
          FF_LEAGUE_ID: ${{ secrets.FF_LEAGUE_ID }}
          FF_SEASON_YEAR: '2026'
          FF_PLAYOFF_CUTOFF: '6'
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          python src/fetch_data.py
          git add docs/data/league_data.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore: update league data $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Reconcile with any commit a neighbouring run may have landed. Both
          # sides regenerate the same JSON, so on conflict keep this run's fresh
          # fetch (-X theirs = the commit being replayed) instead of failing.
          git pull --rebase -X theirs origin main
          git push
