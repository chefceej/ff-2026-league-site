name: Update League Data

on:
  schedule:
    # GitHub cron is UTC and does NOT observe DST, so game-day windows are given
    # in UTC padded to cover both CDT (UTC-5) and CST (UTC-6). Central evening
    # games land on the NEXT UTC day. Actions cron is best-effort and can lag a
    # few minutes, so "every 15 min" is approximate.
    - cron: '0 7 * * *'        # nightly backup, ~2 AM CT (also catches overnight final stats)
    # Thursday Night Football — Thu 7:30-11 PM CT  ->  Fri 00:00-05:00 UTC
    - cron: '*/15 0-4 * * 5'
    - cron: '0 5 * * 5'
    # Sunday slate — Sun 12-11 PM CT  ->  Sun 17:00 UTC through Mon 05:00 UTC
    - cron: '*/15 17-23 * * 0'
    - cron: '*/15 0-4 * * 1'
    - cron: '0 5 * * 1'
    # Monday Night Football — Mon 7:30-11 PM CT  ->  Tue 00:00-05:00 UTC
    - cron: '*/15 0-4 * * 2'
    - cron: '0 5 * * 2'
  workflow_dispatch:          # manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install espn_api

      - name: Fetch league data
        env:
          FF_LEAGUE_ID: ${{ secrets.FF_LEAGUE_ID }}
          FF_SEASON_YEAR: '2026'
          FF_PLAYOFF_CUTOFF: '6'
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: python src/fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/league_data.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update league data $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi
